<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Info</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #1c1e21; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e4e6eb; } }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 6px 10px; border: 1px solid #c8ccd4; border-radius: 6px; background: #fff; color: inherit; }
  @media (prefers-color-scheme: dark) { input, select, button { background: #22252a; border-color: #3a3f47; } }
  #q { flex: 1; min-width: 200px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
  @media (prefers-color-scheme: dark) { table { background: #1d2025; } }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e4e6eb; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { th, td { border-color: #2c3037; } }
  th { cursor: pointer; user-select: none; position: sticky; top: 0; background: #eef0f3; }
  @media (prefers-color-scheme: dark) { th { background: #24272d; } }
  td.mono { font-family: ui-monospace, monospace; font-size: 12.5px; }
  .lvl { display: inline-block; padding: 1px 7px; margin: 1px 2px; border-radius: 10px; background: #e3ecff; font-size: 12px; }
  @media (prefers-color-scheme: dark) { .lvl { background: #26314a; } }
  .miss { color: #c0392b; font-weight: 600; }
  #status { margin: 8px 0; color: #65676b; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { border-radius: 6px; }
  .tab.active { background: #1c6ef2; border-color: #1c6ef2; color: #fff; }
  @media (prefers-color-scheme: dark) { .tab.active { background: #2b7fff; } }
  .src { font-size: 11px; margin-left: 4px; padding: 0 5px; border-radius: 8px; background: #d9f2d9; color: #1b5e20; }
  @media (prefers-color-scheme: dark) { .src { background: #1e3a24; color: #81c784; } }
</style>
</head>
<body>
<h1>Model Info</h1>
<div class="tabs">
  <button class="tab active" data-view="effective">实际上限</button>
  <button class="tab" data-view="raw">Raw</button>
</div>
<div class="bar">
  <input id="q" placeholder="搜索 id / 名称 / provider…">
  <select id="provider"><option value="">全部 provider</option></select>
  <button id="refresh">刷新</button>
  <input id="manualKey" type="password" autocomplete="off" placeholder="management key（宿主未存时手填）">
</div>
<div id="status">加载中…</div>
<table><thead><tr>
  <th data-k="id">ID</th><th data-k="display_name">名称</th><th data-k="provider">Provider</th>
  <th data-k="context_window" data-n>上下文</th><th data-k="max_input_tokens" data-n>最大输入</th><th data-k="max_tokens" data-n>最大输出</th>
  <th>推理等级</th><th>输入</th><th>输出</th>
</tr></thead><tbody id="rows"></tbody></table>
<script>
// Reuse Management Center's existing credential. UI never stores a new secret.
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const STORAGE_KEY_AUTH = "cli-proxy-auth";
let manualKey = "";
function encodeText(t) { return new TextEncoder().encode(t); }
function decodeText(b) { return new TextDecoder().decode(b); }
function keyBytes() {
  try { return encodeText(`${SECRET_SALT}|${window.location.host}|${navigator.userAgent}`); }
  catch { return encodeText(SECRET_SALT); }
}
function hostManagementKey() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY_AUTH); } catch { return ""; }
  if (!raw) return "";
  try {
    if (raw.startsWith(ENC_PREFIX)) {
      const binary = atob(raw.slice(ENC_PREFIX.length));
      const key = keyBytes();
      raw = decodeText(Uint8Array.from(binary, (c, i) => c.charCodeAt(0) ^ key[i % key.length]));
    }
    const parsed = JSON.parse(raw);
    return String((parsed.state ?? parsed).managementKey ?? '').trim();
  } catch { return ""; }
}
function headers() {
  const key = manualKey || hostManagementKey();
  return key ? {Accept: 'application/json', Authorization: 'Bearer ' + key} : {Accept: 'application/json'};
}
const modelInfoAPI = location.origin + '/v0/management/plugins/model-info';
const writerAPI = location.origin + '/v0/management/plugins/sync-config-write';

let rawModels = [], effModels = [], view = 'effective';
let sortKey = 'id', sortAsc = true;
function models() { return view === 'raw' ? rawModels : effModels; }
const rows = document.getElementById('rows'), status = document.getElementById('status');

function fmtK(n) { return n ? (n >= 1000 ? (n/1000).toFixed(0)+'k' : n) : ''; }

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const pv = document.getElementById('provider').value;
  const list = models().filter(m =>
    (!pv || m.provider === pv) &&
    (!q || (m.id + ' ' + (m.display_name||'') + ' ' + (m.provider||'')).toLowerCase().includes(q))
  ).sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const c = typeof x === 'number' ? (x||0) - (y||0) : String(x||'').localeCompare(String(y||''));
    return sortAsc ? c : -c;
  });
  rows.innerHTML = list.map(m => `<tr>
    <td class="mono">${esc(m.id)}</td>
    <td>${esc(m.display_name || m.id)}</td>
    <td class="mono">${esc(m.provider || '')}</td>
    <td class="mono">${fmtK(m.context_window) || '<span class="miss">缺</span>'}</td>
    <td class="mono">${fmtK(m.max_input_tokens) || '<span class="miss">缺</span>'}</td>
    <td class="mono">${fmtK(m.max_tokens) || '<span class="miss">缺</span>'}${m.max_source === 'fallback-context' ? '<span class="src">回退</span>' : m.max_source === 'upstream' ? '<span class="src" style="background:#e8eaf6">原生</span>' : ''}</td>
    <td>${(m.reasoning_levels||[]).map(l => `<span class="lvl">${esc(l)}</span>`).join('') || '<span class="miss">无</span>'}</td>
    <td>${esc((m.input_modalities||[]).join(','))}</td>
    <td>${esc((m.output_modalities||[]).join(','))}</td>
  </tr>`).join('');
  const missingInput = rawModels.filter(m => !m.max_input_tokens).length;
  const missingOutput = rawModels.filter(m => !m.max_tokens).length;
  status.textContent = view === 'raw'
    ? `${list.length} / ${rawModels.length} 个模型（raw，缺最大输入 ${missingInput}，缺最大输出 ${missingOutput}）`
    : `${list.length} / ${effModels.length} 个模型（缺最大输入/输出时按上下文回退）`;
}

async function parseJSON(response) {
  const text = await response.text();
  try { return JSON.parse(text); } catch { throw new Error('HTTP ' + response.status); }
}

async function load() {
  status.textContent = '加载中…';
  try {
    const authHeaders = headers();
    const [rc, re] = await Promise.all([
      fetch(modelInfoAPI + '/catalog', {headers: authHeaders}), fetch(modelInfoAPI + '/effective', {headers: authHeaders}),
    ]);
    if (!rc.ok || !re.ok) throw new Error('HTTP ' + (!rc.ok ? rc.status : re.status));
    const [c, ce] = await Promise.all([parseJSON(rc), parseJSON(re)]);
    rawModels = c.models || [];
    effModels = ce.models || [];
    const provs = [...new Set(rawModels.map(m => m.provider).filter(Boolean))].sort();
    const sel = document.getElementById('provider');
    sel.replaceChildren(new Option('全部 provider', ''), ...provs.map(p => new Option(p, p)));
    render();
  } catch (e) { status.textContent = '请求失败: ' + e; }
}

async function refresh() {
  status.textContent = 'Writer 刷新中…';
  try {
    const trigger = await fetch(writerAPI + '/model-info/catalog', {method: 'POST', headers: headers()});
    const accepted = await parseJSON(trigger);
    if (trigger.status !== 202 || !accepted.run_id) throw new Error(accepted.error_code || 'HTTP ' + trigger.status);
    for (;;) {
      await new Promise(resolve => setTimeout(resolve, 500));
      const response = await fetch(writerAPI + '/status?run_id=' + encodeURIComponent(accepted.run_id), {headers: headers()});
      const run = await parseJSON(response);
      if (!response.ok) throw new Error(run.error_code || 'HTTP ' + response.status);
      if (['succeeded', 'failed', 'uncertain', 'blocked'].includes(run.state)) {
        if (run.state !== 'succeeded') throw new Error(run.error_code || run.state);
        await load();
        return;
      }
    }
  } catch (e) { status.textContent = '刷新失败: ' + e; }
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('provider').addEventListener('change', render);
document.getElementById('refresh').addEventListener('click', refresh);
document.getElementById('manualKey').addEventListener('change', event => { manualKey = event.target.value.trim(); load(); });
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  view = tab.dataset.view;
  render();
}));

document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
  render();
}));
load();
</script>
</body>
</html>
