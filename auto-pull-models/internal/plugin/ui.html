<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auto Pull Models</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px system-ui,sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
    textarea { width: 100%; min-height: 420px; font: 13px ui-monospace,monospace; box-sizing: border-box; }
    button { padding: 8px 12px; margin: 10px 6px 10px 0; }
    pre { white-space: pre-wrap; border: 1px solid #8885; padding: 12px; border-radius: 8px; }
    .muted { opacity: .7; }
  </style>
</head>
<body>
  <h1>Auto Pull Models</h1>
  <p class="muted">OpenAI-compatible membership only. Selectors require exact channel name + normalized base URL. Metadata is managed by model-metadata-sync.</p>
  <textarea id="config" aria-label="JSON config"></textarea>
  <div>
    <button id="reload">Reload</button><button id="channels">Channels</button><button id="save">Save</button><button id="preview">Preview</button><button id="sync">Sync</button>
  </div>
  <pre id="output">Loading…</pre>
<script>
const base = location.origin + "/v0/management/plugins/auto-pull-models";
const output = document.getElementById("output");
const config = document.getElementById("config");
function auth() {
  try {
    const raw = localStorage.getItem("cli-proxy-auth");
    if (!raw || raw.startsWith("enc::")) return {};
    const parsed = JSON.parse(raw).state || JSON.parse(raw);
    return parsed.managementKey ? {Authorization:"Bearer "+parsed.managementKey} : {};
  } catch { return {}; }
}
async function call(method, path, body) {
  const headers = {...auth(), Accept:"application/json"};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const response = await fetch(base+path, {method, headers, body});
  const text = await response.text();
  let value; try { value = JSON.parse(text); } catch { value = text; }
  output.textContent = JSON.stringify(value, null, 2);
  if (!response.ok) throw new Error(response.status+" "+text);
  return value;
}
async function load() {
  const response = await fetch(base+"/json", {headers:{...auth(), Accept:"application/json"}});
  config.value = await response.text();
  output.textContent = response.ok ? "Loaded." : config.value;
}
document.getElementById("reload").onclick = load;
document.getElementById("channels").onclick = () => call("GET", "/channels");
document.getElementById("save").onclick = () => call("PUT", "/json", config.value);
document.getElementById("preview").onclick = () => call("POST", "/preview", config.value);
document.getElementById("sync").onclick = () => call("POST", "/sync", config.value);
load().catch(error => output.textContent = error.message);
</script>
</body>
</html>
