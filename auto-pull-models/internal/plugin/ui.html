<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>自动拉取模型</title>
  <style>
    :root { color-scheme: light dark; --bd: color-mix(in srgb, currentColor 18%, transparent); }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0 auto; padding: 20px; max-width: 1100px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    h2 { font-size: 1.05rem; margin: 22px 0 10px; }
    .muted { opacity: .72; font-size: .92rem; }
    .err { color: #c62828; }
    .ok { color: #2e7d32; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    button, select, input[type=text] { font: inherit; padding: 7px 10px; }
    button.primary { font-weight: 600; }
    .card { border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin: 10px 0; }
    .card h3 { margin: 0 0 8px; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; align-items: start; }
    textarea.patterns, textarea.overrides { width: 100%; min-height: 72px; font-family: ui-monospace, monospace; font-size: 13px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .source-group { border: 1px solid var(--bd); border-radius: 10px; padding: 10px; margin: 8px 0; }
    .source-group h4 { margin: 0 0 4px; font-size: .95rem; }
    .source-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--bd); }
    .source-row:last-child { border-bottom: 0; }
    .source-id { overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 12px; }
    .source-actions { display: flex; gap: 4px; }
    .source-actions button { padding: 3px 7px; }
    .unavailable { color: #c62828; font-size: .8rem; }
    .metadata-list { margin-top: 12px; }
    .metadata-model { border: 1px solid var(--bd); border-radius: 8px; margin: 7px 0; }
    .metadata-model summary { cursor: pointer; padding: 9px 11px; font-family: ui-monospace, monospace; font-weight: 600; }
    .metadata-table-wrap { overflow-x: auto; padding: 0 10px 10px; }
    .metadata-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .metadata-table th, .metadata-table td { border-bottom: 1px solid var(--bd); padding: 7px; text-align: left; vertical-align: top; }
    .metadata-table th { white-space: nowrap; }
    .metadata-value, .metadata-source { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    .status-authoritative, .status-upstream, .status-override { color: #2e7d32; }
    .status-completed { color: #1565c0; }
    .status-skipped { color: #c62828; }
    .catalog-errors { border-left: 3px solid #c62828; padding-left: 9px; }
    @media (max-width: 800px) { .cols, .grid { grid-template-columns: 1fr; } .source-row { grid-template-columns: 1fr; } }
    .list { border: 1px solid var(--bd); border-radius: 8px; padding: 8px; max-height: 240px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--bd); font-size: .8rem; }
    label.inline { display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; }
  </style>
</head>
<body>
  <h1>自动拉取模型</h1>
  <p class="muted">从 CPA 已有的 OpenAI 兼容渠道拉上游模型列表，用正则过滤后再写回 AI Providers。进入页面会自动刷新上游目录。</p>
  <p id="banner" class="muted"></p>
  <div id="loginBox" class="card" hidden>
    <h3>连接 CPA</h3>
    <p class="muted">未读到 Management Center 登录态时才需要这一步（与官方插件相同）。</p>
    <div class="grid">
      <div>API 地址</div><div><input id="loginBase" type="text" size="36" placeholder="http://127.0.0.1:8317"/></div>
      <div>Management Key</div><div><input id="loginKey" type="password" size="36" autocomplete="off"/></div>
    </div>
    <div class="row"><button id="loginBtn" class="primary">连接</button></div>
  </div>

  <div class="card">
    <h3>全局</h3>
    <div class="row">
      <label>同步周期
        <select id="interval">
          <option value="0">仅手动</option>
          <option value="15m">每 15 分钟</option>
          <option value="30m">每 30 分钟</option>
          <option value="1h" selected>每 1 小时</option>
          <option value="3h">每 3 小时</option>
          <option value="6h">每 6 小时</option>
        </select>
      </label>
      <label class="inline"><input type="checkbox" id="keepAlias" checked/> 保留已有别名</label>
      <span id="keyState" class="muted"></span>
    </div>
  </div>

  <div class="row">
    <select id="addSelect"></select>
    <button id="addBtn">添加这个渠道</button>
  </div>
  <div id="cards"></div>

  <div class="row">
    <button id="reload">重新加载</button>
    <button id="save">保存规则</button>
    <button id="preview" class="primary">试运行（不写入）</button>
    <button id="apply">确认写入</button>
  </div>
  <p id="msg" class="muted"></p>
  <div id="result"></div>

  <script>
    const api = location.origin + "/v0/management/plugins/auto-pull-models";
    let cfg = {interval:"1h", management_base_url:"http://127.0.0.1:8317", management_key_env:"", management_key_file:"/CLIProxyAPI/mgmt.key", keep_existing_aliases:true, providers:{}};
    let hostProviders = [];
    let metadataSources = [];
    let metadataSourceErrors = {};

    // Host auth: same as cpa-key-policy / cpa-account-config-manager.
    const ENC_PREFIX = "enc::v1::";
    const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
    const STORAGE_KEY_AUTH = "cli-proxy-auth";
    let cachedKeyBytes = null;
    let sessionAuth = null;
    function encodeText(text) { return new TextEncoder().encode(text); }
    function decodeText(bytes) { return new TextDecoder().decode(bytes); }
    function getKeyBytes() {
      if (cachedKeyBytes) return cachedKeyBytes;
      try {
        cachedKeyBytes = encodeText(`${SECRET_SALT}|${window.location.host}|${navigator.userAgent}`);
      } catch {
        cachedKeyBytes = encodeText(SECRET_SALT);
      }
      return cachedKeyBytes;
    }
    function xorBytes(data, keyBytes) {
      const result = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) result[i] = data[i] ^ keyBytes[i % keyBytes.length];
      return result;
    }
    function fromBase64(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    function deobfuscateData(payload) {
      if (!payload || !payload.startsWith(ENC_PREFIX)) return payload;
      try {
        return decodeText(xorBytes(fromBase64(payload.slice(ENC_PREFIX.length)), getKeyBytes()));
      } catch {
        return payload;
      }
    }
    function inIframe() {
      try { return window.self !== window.top; } catch { return false; }
    }
    function parseHostAuth(obj) {
      if (!obj || typeof obj !== "object") return null;
      const n = obj.state ?? obj;
      const apiBase = typeof n.apiBase === "string" ? n.apiBase.trim() : "";
      const managementKey = typeof n.managementKey === "string" ? n.managementKey.trim() : "";
      if (!apiBase || !managementKey) return null;
      return { apiBase, managementKey };
    }
    // cpa-key-policy: only auto-read host storage inside the Management Center iframe.
    function readHostAuth() {
      if (!inIframe()) return null;
      let raw;
      try { raw = localStorage.getItem(STORAGE_KEY_AUTH); } catch { return null; }
      if (!raw) return null;
      let plain;
      try { plain = deobfuscateData(raw); } catch { return null; }
      try { return parseHostAuth(JSON.parse(plain)); } catch { return null; }
    }
    function currentAuth() {
      return sessionAuth || readHostAuth();
    }
    function mgmtKey() {
      const auth = currentAuth();
      return (auth && auth.managementKey) || "";
    }
    function updateKeyState() {
      const el = document.getElementById("keyState");
      const loginBox = document.getElementById("loginBox");
      if (mgmtKey()) {
        el.textContent = "已从 Management Center 读取密钥";
        el.className = "ok";
        if (loginBox) loginBox.hidden = true;
        return true;
      }
      el.textContent = inIframe()
        ? "未读到 cli-proxy-auth（请确认已登录并勾选记住密码）"
        : "请从 Management Center 菜单打开，或在下方连接";
      el.className = "err";
      if (loginBox) {
        loginBox.hidden = false;
        const base = document.getElementById("loginBase");
        if (base && !base.value) base.value = location.origin;
      }
      return false;
    }

    async function call(method, path, body) {
      const headers = {"Accept":"application/json"};
      const key = mgmtKey();
      if (key) headers["Authorization"] = "Bearer " + key;
      let payload;
      if (body !== undefined) {
        headers["Content-Type"] = "application/json";
        payload = typeof body === "string" ? body : JSON.stringify(body);
      }
      const res = await fetch(api + path, {method, headers, body: payload});
      const text = await res.text();
      let data; try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok && !(data && data.providers)) {
        throw new Error(typeof data === "string" ? data : (data.error || JSON.stringify(data)));
      }
      return data;
    }

    function sourceWebsite(id) {
      if (String(id).startsWith("modelparams.dev/")) return "modelparams.dev";
      if (String(id).startsWith("models.dev/")) return "models.dev";
      return "";
    }

    function sourceInfo(id) {
      return metadataSources.find(source => source.id === id);
    }

    function configuredSources(provider, website) {
      const ids = Array.isArray(provider.metadata_sources) ? provider.metadata_sources : [];
      return ids.filter(id => sourceWebsite(id) === website);
    }

    function sourceRowHTML(id) {
      const info = sourceInfo(id);
      return `<div class="source-row" data-source-id="${escapeHtml(id)}">
        <div>
          <div class="source-id">${escapeHtml(id)}</div>
          ${info ? "" : `<div class="unavailable">当前目录中不可用；保留此配置，避免保存时静默删除</div>`}
        </div>
        <div class="source-actions">
          <button type="button" data-source-action="up" title="上移" aria-label="上移来源">↑</button>
          <button type="button" data-source-action="down" title="下移" aria-label="下移来源">↓</button>
          <button type="button" data-source-action="remove" aria-label="删除来源">删除</button>
        </div>
      </div>`;
    }

    function sourceGroupHTML(provider, website) {
      const authoritative = website === "modelparams.dev";
      const ids = configuredSources(provider, website);
      const error = metadataSourceErrors[website];
      return `<div class="source-group" data-source-group="${website}">
        <h4>${authoritative ? "1. modelparams.dev（第一权威）" : "2. models.dev（第二权威，仅补缺）"}</h4>
        <div class="muted">${authoritative
          ? "provider / api_key 与 provider / subscription 是不同来源；按此组顺序查找每个字段。"
          : "只补 modelparams.dev、上游和已有配置仍未提供的字段，不会覆盖前序值。"}</div>
        ${error ? `<p class="err">目录获取失败：${escapeHtml(error)}</p>` : ""}
        <div data-source-list="${website}">
          ${ids.length ? ids.map(sourceRowHTML).join("") : `<div class="muted source-empty">尚未选择此网站的来源</div>`}
        </div>
        <div class="row">
          <select data-source-select="${website}"></select>
          <button type="button" data-source-add="${website}">添加一个来源</button>
        </div>
      </div>`;
    }

    function selectedSourceIDs(card, website) {
      const list = card.querySelector(`[data-source-list="${website}"]`);
      return Array.from(list.querySelectorAll(".source-row")).map(row => row.dataset.sourceId);
    }

    function refreshSourceGroup(card, website) {
      const list = card.querySelector(`[data-source-list="${website}"]`);
      const rows = Array.from(list.querySelectorAll(".source-row"));
      if (!rows.length && !list.querySelector(".source-empty")) {
        list.innerHTML = `<div class="muted source-empty">尚未选择此网站的来源</div>`;
      }
      rows.forEach((row, index) => {
        row.querySelector('[data-source-action="up"]').disabled = index === 0;
        row.querySelector('[data-source-action="down"]').disabled = index === rows.length - 1;
      });
      const selected = new Set(rows.map(row => row.dataset.sourceId));
      const available = metadataSources.filter(source => source.website === website && !selected.has(source.id));
      const select = card.querySelector(`[data-source-select="${website}"]`);
      const add = card.querySelector(`[data-source-add="${website}"]`);
      select.innerHTML = available.length
        ? available.map(source => `<option value="${escapeHtml(source.id)}">${escapeHtml(source.label || source.id)}</option>`).join("")
        : `<option value="">没有其它可选来源</option>`;
      select.disabled = !available.length;
      add.disabled = !available.length;
    }

    function bindSourceRow(card, row, website) {
      row.querySelectorAll("[data-source-action]").forEach(button => {
        button.onclick = () => {
          const list = row.parentElement;
          const action = button.dataset.sourceAction;
          if (action === "remove") {
            row.remove();
          } else if (action === "up") {
            const previous = row.previousElementSibling;
            if (previous && previous.classList.contains("source-row")) list.insertBefore(row, previous);
          } else if (action === "down") {
            const next = row.nextElementSibling;
            if (next && next.classList.contains("source-row")) list.insertBefore(next, row);
          }
          refreshSourceGroup(card, website);
        };
      });
    }

    function bindSourceGroup(card, website) {
      const list = card.querySelector(`[data-source-list="${website}"]`);
      list.querySelectorAll(".source-row").forEach(row => bindSourceRow(card, row, website));
      const select = card.querySelector(`[data-source-select="${website}"]`);
      card.querySelector(`[data-source-add="${website}"]`).onclick = () => {
        const id = select.value;
        if (!id) return;
        const empty = list.querySelector(".source-empty");
        if (empty) empty.remove();
        list.insertAdjacentHTML("beforeend", sourceRowHTML(id));
        bindSourceRow(card, list.lastElementChild, website);
        refreshSourceGroup(card, website);
      };
      refreshSourceGroup(card, website);
    }

    function formConfig() {
      const providers = {};
      document.querySelectorAll("[data-card]").forEach(card => {
        const name = card.dataset.card;
        const patterns = card.querySelector(".patterns").value.split("\n").map(s => s.trim()).filter(Boolean);
        const rawOverrides = card.querySelector(".overrides").value.trim();
        const overrides = rawOverrides ? JSON.parse(rawOverrides) : {};
        if (!overrides || Array.isArray(overrides) || typeof overrides !== "object") {
          throw new Error(`${name} 的模型覆盖必须是 JSON object`);
        }
        const metadataSourceIDs = [
          ...selectedSourceIDs(card, "modelparams.dev"),
          ...selectedSourceIDs(card, "models.dev")
        ];
        if (card.dataset.legacyMetadata === "true" && !metadataSourceIDs.length) {
          throw new Error(`${name} 使用旧 modelparams/modelsdev 开关；请先手动选择完整元数据来源`);
        }
        providers[name] = {
          enabled: card.querySelector(".en").checked,
          mode: card.querySelector(".mode").value,
          patterns,
          metadata_sources: metadataSourceIDs,
          upstream_meta: card.querySelector(".um").checked,
          codex_manifest: card.querySelector(".cm").checked,
          overrides
        };
      });
      return {
        ...cfg,
        interval: document.getElementById("interval").value,
        keep_existing_aliases: document.getElementById("keepAlias").checked,
        providers
      };
    }

    function renderCards() {
      const box = document.getElementById("cards");
      box.innerHTML = "";
      const names = Object.keys(cfg.providers || {});
      if (!names.length) {
        box.innerHTML = "<p class='muted'>还没有要同步的渠道。上面下拉框选一个 CPA 里已有的 OpenAI 兼容渠道，点添加。</p>";
        return;
      }
      names.forEach((name, cardIndex) => {
        const p = cfg.providers[name] || {enabled:true, mode:"include", patterns:[], metadata_sources:[]};
        const host = hostProviders.find(h => h.name === name);
        const radioName = `mode-${cardIndex}`;
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.card = name;
        card.dataset.legacyMetadata = p.modelparams || p.modelsdev ? "true" : "false";
        card.innerHTML = `
          <h3>${escapeHtml(name)} ${host ? `<span class="pill">${host.model_count} 个现有模型</span>` : `<span class="pill">CPA 中未找到</span>`}</h3>
          ${p.modelparams || p.modelsdev ? `<p class="err">检测到旧 modelparams/modelsdev 开关。保存前必须从下面目录中手动选择完整来源；保存后旧开关会被移除。</p>` : ""}
          <div class="grid">
            <div>启用</div><div><label class="inline"><input class="en" type="checkbox" ${p.enabled?"checked":""}/> 同步这个渠道</label></div>
            <div>上游元数据</div><div>
              <label class="inline"><input class="cm" type="checkbox" ${p.codex_manifest?"checked":""}/> 请求 Codex manifest（client_version=1.0.0）</label>
              <div class="muted">仅用于支持 Codex 模型目录的上游，例如 ZCode；其它渠道保持关闭。</div>
              <label class="inline"><input class="um" type="checkbox" ${p.upstream_meta?"checked":""}/> 使用上游 /models 元数据</label>
              <div class="muted">复用本次拉取目录中的 reasoning、上下文/输出上限和模态；不额外请求。</div>
            </div>
            <div>外部元数据来源</div><div>
              <div class="muted">每个渠道独立配置；只查询以下列表，不猜 provider，不查询列表外来源。</div>
              ${sourceGroupHTML(p, "modelparams.dev")}
              ${sourceGroupHTML(p, "models.dev")}
            </div>
            <div>模型覆盖</div>
            <div>
              <textarea class="overrides" placeholder='{"模型 id":{"max_context_length":262144,"max_input_tokens":240000,"max_output_tokens":22144,"thinking_levels":["low","high"]}}'>${escapeHtml(JSON.stringify(p.overrides||{}, null, 2))}</textarea>
              <div class="muted">JSON object，key 精确匹配上游模型 id。同步时最后生效，并在报告中标记为 manual override。</div>
            </div>
            <div>规则</div>
            <div>
              <label class="inline"><input class="mode-radio" type="radio" name="${radioName}" value="include" ${p.mode!=="exclude"?"checked":""}/> 只保留匹配</label>
              <label class="inline"><input class="mode-radio" type="radio" name="${radioName}" value="exclude" ${p.mode==="exclude"?"checked":""}/> 排除匹配</label>
              <select class="mode" hidden>
                <option value="include" ${p.mode!=="exclude"?"selected":""}>include</option>
                <option value="exclude" ${p.mode==="exclude"?"selected":""}>exclude</option>
              </select>
            </div>
            <div>正则<br><span class="muted">一行一条</span></div>
            <div>
              <textarea class="patterns" placeholder="例如 gpt-&#10;^anthropic/&#10;embed">${escapeHtml((p.patterns||[]).join("\n"))}</textarea>
              <div class="muted">只保留：匹配任一正则的留下。排除：匹配的丢掉。排除且不填 = 全要。</div>
            </div>
          </div>
          <div class="row">
            <button data-preview>试运行这一条</button>
            <button data-del>移除</button>
          </div>`;
        card.querySelectorAll(".mode-radio").forEach(radio => {
          radio.onchange = () => { card.querySelector(".mode").value = radio.value; };
        });
        bindSourceGroup(card, "modelparams.dev");
        bindSourceGroup(card, "models.dev");
        card.querySelector("[data-del]").onclick = () => { delete cfg.providers[name]; renderCards(); fillAdd(); };
        card.querySelector("[data-preview]").onclick = () => run("preview", name);
        box.appendChild(card);
      });
    }

    function fillAdd() {
      const sel = document.getElementById("addSelect");
      const used = new Set(Object.keys(cfg.providers || {}));
      const rest = hostProviders.filter(p => !used.has(p.name));
      sel.innerHTML = rest.length
        ? rest.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}（当前 ${p.model_count} 个模型）</option>`).join("")
        : `<option value="">没有可添加的渠道</option>`;
      sel.disabled = !rest.length;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function metadataValue(value) {
      if (value === undefined || value === null || value === "") return "—";
      if (Array.isArray(value)) return value.join(", ");
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function statusLabel(status) {
      return ({
        upstream: "上游提供",
        authoritative: "权威来源",
        completed: "第二来源补全",
        preserved: "保留已有值",
        override: "手工覆盖",
        skipped: "跳过"
      })[status] || status || "未知";
    }

    function reasonLabel(reason) {
      return ({
        "supplied by enabled upstream metadata": "启用的上游 /models 提供",
        "supplied by upstream metadata before models.dev fallback": "在 models.dev 补全前，优先采用上游 /models 提供的上下文或输出上限",
        "first configured authoritative source supplying this field": "配置顺序中第一个提供此字段的权威来源",
        "concrete generation-length range.max from authoritative source": "权威来源给出了 generation-length 的具体 range.max",
        "secondary source filled a field missing from authoritative and earlier sources": "权威来源和更早来源均未提供，由第二权威来源补全",
        "copied from existing CPA model configuration": "从 CPA 现有模型配置保留",
        "explicit per-model override applied last": "逐模型手工覆盖最后生效",
        "tried sources supplied no value": "已按显示顺序尝试来源，但均未提供此字段",
        "no configured source supports this field": "当前配置来源均不支持自动提供此字段",
        "no automatic source supports this field; preserve an existing value or use manual override": "没有自动来源支持此字段；请保留已有值或使用手工覆盖"
      })[reason] || reason || "—";
    }

    function renderModelMetadata(model) {
      const fields = Array.isArray(model.fields) ? model.fields : [];
      return `<details class="metadata-model">
        <summary>${escapeHtml(model.model || "（未知模型）")}</summary>
        <div class="metadata-table-wrap">
          <table class="metadata-table">
            <thead><tr><th>参数</th><th>最终值</th><th>来源</th><th>状态</th><th>尝试顺序</th><th>原因</th></tr></thead>
            <tbody>${fields.map(field => {
              const status = ["upstream","authoritative","completed","preserved","override","skipped"].includes(field.status) ? field.status : "";
              const tried = Array.isArray(field.tried_sources) ? field.tried_sources.join(" → ") : "";
              return `<tr>
                <td class="metadata-source">${escapeHtml(field.field || "")}</td>
                <td class="metadata-value">${escapeHtml(metadataValue(field.value))}</td>
                <td class="metadata-source">${escapeHtml(field.source || "—")}</td>
                <td class="status-${status}">${escapeHtml(statusLabel(field.status))}</td>
                <td class="metadata-source">${escapeHtml(tried || "—")}</td>
                <td>${escapeHtml(reasonLabel(field.reason))}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="6" class="muted">没有字段明细</td></tr>`}</tbody>
          </table>
        </div>
      </details>`;
    }

    function renderReport(data) {
      const el = document.getElementById("result");
      if (!data || !data.providers) {
        el.innerHTML = `<p class="err">${escapeHtml(data && data.error || "没有结果")}</p>`;
        return;
      }
      el.innerHTML = data.providers.map(provider => {
        const klass = provider.error ? "err" : "ok";
        const catalogErrors = Array.isArray(provider.catalog_errors) ? provider.catalog_errors : [];
        const metadata = Array.isArray(provider.metadata) ? provider.metadata : [];
        return `<div class="card">
          <h3>${escapeHtml(provider.name)} <span class="pill">${provider.dry_run?"试运行":"已写入"}</span></h3>
          <p class="${klass}">${provider.error ? escapeHtml(provider.error) : `上游 ${provider.fetched} → 保留 ${provider.kept}，丢掉 ${provider.dropped}，将写入 ${provider.written}（当前 ${provider.current}）${provider.unchanged?"，和现在一样":""}${provider.thinking_matched||provider.thinking_missed?`；推理强度来源命中 ${provider.thinking_matched||0}，未命中 ${provider.thinking_missed||0}`:""}`}</p>
          ${catalogErrors.length ? `<div class="catalog-errors"><strong>外部目录错误</strong>${catalogErrors.map(error => `<div class="err">${escapeHtml(error)}</div>`).join("")}</div>` : ""}
          <div class="cols">
            <div><div class="muted">将保留</div><div class="list">${(provider.kept_samples||[]).map(escapeHtml).join("<br>") || "（空）"}</div></div>
            <div><div class="muted">将丢掉</div><div class="list">${(provider.dropped_samples||[]).map(escapeHtml).join("<br>") || "（空）"}</div></div>
          </div>
          <div class="metadata-list">
            <h4>逐模型参数来源（${metadata.length} 个模型）</h4>
            <div class="muted">展开模型查看每个参数由哪个完整来源提供、为何补全，或为何跳过。</div>
            ${metadata.map(renderModelMetadata).join("") || `<p class="muted">本次没有生成模型字段明细。</p>`}
          </div>
        </div>`;
      }).join("") + (data.error ? `<p class="err">${escapeHtml(data.error)}</p>` : "");
    }

    async function load() {
      if (!updateKeyState()) {
        document.getElementById("banner").textContent = "等待 Management Center 登录态…";
        return;
      }
      document.getElementById("banner").textContent = "正在加载…";
      cfg = await call("GET", "/json");
      if (typeof cfg === "string") cfg = JSON.parse(cfg);
      cfg.providers = cfg.providers || {};
      document.getElementById("interval").value = cfg.interval || "1h";
      document.getElementById("keepAlias").checked = cfg.keep_existing_aliases !== false;
      try {
        const [host, sources] = await Promise.all([
          call("GET", "/compat-providers"),
          call("GET", "/metadata-sources")
        ]);
        hostProviders = host.providers || [];
        metadataSources = sources.sources || [];
        metadataSourceErrors = sources.errors || {};
      } catch (e) {
        hostProviders = [];
        metadataSources = [];
        metadataSourceErrors = {"modelparams.dev": e.message, "models.dev": e.message};
        document.getElementById("banner").textContent = e.message;
        renderCards();
        fillAdd();
        return;
      }
      renderCards();
      fillAdd();
      const names = Object.keys(cfg.providers || {});
      if (!names.length) {
        document.getElementById("banner").textContent = "还没有要同步的渠道。";
        return;
      }
      document.getElementById("banner").textContent = "正在刷新上游目录…";
      await run("preview");
      document.getElementById("banner").textContent = Object.keys(metadataSourceErrors).length
        ? `已自动刷新；部分外部目录不可用：${Object.keys(metadataSourceErrors).join("、")}`
        : "已自动刷新。确认无误后再写入。";
    }

    async function run(kind, only) {
      const msg = document.getElementById("msg");
      msg.textContent = kind === "preview" ? "正在试运行…" : "正在写入…";
      try {
        const body = formConfig();
        const q = only ? ("?provider=" + encodeURIComponent(only)) : "";
        const data = await call("POST", "/" + kind + q, body);
        renderReport(data);
        msg.textContent = kind === "preview" ? "试运行完成，尚未写入。" : "写入完成。";
        msg.className = data.ok ? "ok" : "err";
      } catch (e) {
        msg.textContent = e.message;
        msg.className = "err";
      }
    }

    document.getElementById("addBtn").onclick = () => {
      const name = document.getElementById("addSelect").value;
      if (!name) return;
      cfg.providers[name] = {enabled:true, mode:"exclude", patterns:[], metadata_sources:[], upstream_meta:false, overrides:{}};
      renderCards();
      fillAdd();
    };
    document.getElementById("reload").onclick = () => load().catch(e => alert(e.message));
    document.getElementById("save").onclick = async () => {
      try {
        await call("PUT", "/json", formConfig());
        document.getElementById("msg").textContent = "规则已保存。";
        document.getElementById("msg").className = "ok";
        await load();
      } catch (e) { alert(e.message); }
    };
    document.getElementById("preview").onclick = () => run("preview");
    document.getElementById("apply").onclick = () => {
      if (!confirm("确认把试运行的结果写入 AI Providers 模型列表？")) return;
      run("sync");
    };
    document.getElementById("loginBtn").onclick = () => {
      const apiBase = (document.getElementById("loginBase").value || "").trim();
      const managementKey = (document.getElementById("loginKey").value || "").trim();
      if (!apiBase || !managementKey) {
        document.getElementById("banner").textContent = "请填写 API 地址和 Management Key";
        return;
      }
      sessionAuth = { apiBase, managementKey };
      load().catch(e => document.getElementById("banner").textContent = e.message);
    };
    load().catch(e => document.getElementById("banner").textContent = e.message);
  </script>
</body>
</html>
